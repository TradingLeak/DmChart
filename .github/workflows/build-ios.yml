name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iPhone and iPad
        run: |
          set -euo pipefail
          xcodebuild \
            -project DmChart.xcodeproj \
            -scheme DmChart \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/DmChart.app"
          IPA_ROOT="build/ipa"
          test -d "$APP_PATH"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/DmChart.app"
          (cd "$IPA_ROOT" && /usr/bin/zip -qry ../DmChart-unsigned.ipa Payload)
          shasum -a 256 build/DmChart-unsigned.ipa > build/DmChart-unsigned.ipa.sha256
          ls -lh build/DmChart-unsigned.ipa build/DmChart-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DmChart-unsigned-ipa
          path: |
            build/DmChart-unsigned.ipa
            build/DmChart-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
